<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album</title>

    <meta name="description"
        content="A responsive temple photo album showcasing beautiful temples with a mobile-first design.">

    <meta name="author" content="Ikechukwu Jonathan Boniface">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Merriweather:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

</head>

<body>

    <header>

        <h2>Temple Album</h2>

        <button id="menu" aria-label="Navigation Menu"></button>

        <nav class="navigation">

            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>

        </nav>

    </header>

    <main>

        <h1>Home</h1>

        <div class="gallery">

            <figure>
                <img src="images/california.jpg" alt="San Diego California Temple" loading="lazy">
                <figcaption>San Diego California</figcaption>
            </figure>

            <figure>
                <img src="images/salt-lake.jpg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome.jpg" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/washington.jpeg" alt="Washington D.C. Temple" loading="lazy">
                <figcaption>Washington D.C.</figcaption>
            </figure>

            <figure>
                <img src="images/ghana.jpg" alt="Accra Ghana Temple" loading="lazy">
                <figcaption>Accra Ghana</figcaption>
            </figure>

            <figure>
                <img src="images/nigeria.jpg" alt="Aba Nigeria Temple" loading="lazy">
                <figcaption>Aba Nigeria</figcaption>
            </figure>

            <figure>
                <img src="images/johannesburg.jpg" alt="Johannesburg South Africa Temple" loading="lazy">
                <figcaption>Johannesburg</figcaption>
            </figure>

            <figure>
                <img src="images/paris.jpg" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France</figcaption>
            </figure>

            <figure>
                <img src="images/brigham.jpg" alt="Brigham City Utah Temple" loading="lazy">
                <figcaption>Brigham City Utah</figcaption>
            </figure>

        </div>

    </main>

    <footer>

        <p>
            &copy; <span id="currentyear"></span>
            🌺 Ikechukwu Jonathan Boniface 🌺 Nigeria
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
