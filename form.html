<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Product review form. Share your experience with a product by submitting a rating and review.">
    <meta name="author" content="Ikechukwu Jonathan Boniface">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
        <p>Share your experience with a product.</p>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">
                <label for="product">
                    Product Name
                    <span class="required">*</span>
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>


            <!-- Overall Rating -->
            <div class="form-group rating-group">
                <fieldset class="rating-field">
            
                    <legend>
                        Overall Rating
                        <span class="required">*</span>
                    </legend>
            
                    <div class="rating-options">
            
                        <label for="rating1">
                            <span class="star">☆</span>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </label>
            
                        <label for="rating2">
                            <span class="star">☆☆</span>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </label>
            
                        <label for="rating3">
                            <span class="star">☆☆☆</span>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </label>
            
                        <label for="rating4">
                            <span class="star">☆☆☆☆</span>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </label>
            
                        <label for="rating5">
                            <span class="star">☆☆☆☆☆</span>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </label>
            
                    </div>
            
                </fieldset>
            </div>
            
            <!-- Date of Installation -->
            <div class="form-group installation-group">

                <label for="installDate">
                    Date of Installation
                    <span class="required">*</span>
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>


            <!-- Useful Features -->
            <fieldset class="features-fieldset">

                <legend>
                    Which feature did you find useful in the product?
                    <em>(Select all that apply)</em>
                </legend>

                <div class="checkbox-group">

                    <label for="feature1">
                        <input type="checkbox" id="feature1" name="features" value="Easy to use">
                        Easy to use
                    </label>

                    <label for="feature2">
                        <input type="checkbox" id="feature2" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="feature3">
                        <input type="checkbox" id="feature3" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="feature4">
                        <input type="checkbox" id="feature4" name="features" value="Design">
                        Design
                    </label>

                </div>

            </fieldset>


            <!-- Written Review -->
            <div class="form-group">

                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6" placeholder="Write your review here..."></textarea>

            </div>


            <!-- User Name -->
            <div class="form-group">

                <label for="userName">
                    User Name
                </label>

                <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Enter your name">

            </div>


            <!-- Submit -->
            <input type="submit" value="Submit Review" class="submit-button">

        </form>

    </main>

    <footer>
        <p>
            &copy;
            <span id="currentyear"></span>
            | Ikechukwu Jonathan Boniface | Nigeria
        </p>
    
        <p id="lastModified"></p>
    </footer>

</body>

</html>
